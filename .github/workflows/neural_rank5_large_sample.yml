name: Neural Rank 5 Large Sample

on:
  workflow_dispatch:

jobs:
  backtest:

    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: horse_prono_v2/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r horse_prono_v2/requirements.txt
          pip install joblib
          pip install --upgrade "scikit-learn==1.9.1"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Check Neural V1 files
        run: |
          echo "=========================================="
          echo "CHECK NEURAL V1"
          echo "=========================================="

          test -f models/neural/horseprono_neural_v1.pt
          test -f models/neural/horseprono_neural_v1_scaler.joblib
          test -f models/neural/horseprono_neural_v1_features.json

          echo "✅ Neural V1 files found"

      - name: Run Rank 5 large sample backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

        run: |
          python -u -m neural.backtest_rank5_large_sample \
            --start 2026-06-01 \
            --end 2026-09-12

      - name: Upload Rank 5 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-rank5-large-sample-results
          path: artifacts/rank5_large_sample/
          if-no-files-found: warn
