name: Export Supabase History

on:
  workflow_dispatch:

jobs:
  export-history:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: horse_prono_v2/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r horse_prono_v2/requirements.txt
          pip install pandas supabase

      - name: Export Supabase history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

        run: |
          python -u horse_prono_v2/scripts/export_supabase_history.py

      - name: Show exported files
        run: |
          echo "=========================================="
          echo "HORSEPRONO SUPABASE EXPORT"
          echo "=========================================="

          ls -lh horse_prono_v2/artifacts/supabase_history/

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: horseprono-supabase-history
          path: horse_prono_v2/artifacts/supabase_history/horseprono_supabase_history.zip
          if-no-files-found: error
          retention-days: 30
