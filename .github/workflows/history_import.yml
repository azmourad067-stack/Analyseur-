name: HorseProno historical import

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Date de début (YYYY-MM-DD)"
        required: true
        default: "2026-09-02"

      end_date:
        description: "Date de fin (YYYY-MM-DD)"
        required: true
        default: "2026-09-08"

jobs:
  import-history:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: horse_prono_v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import PMU history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/import_history.py api \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}"
