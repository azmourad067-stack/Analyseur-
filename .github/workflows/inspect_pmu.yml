name: Inspect PMU participant fields

on:
  workflow_dispatch:

jobs:

  inspect:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: horse_prono_v2

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Inspect PMU fields
        run: |
          python -u scripts/inspect_pmu_participants.py
