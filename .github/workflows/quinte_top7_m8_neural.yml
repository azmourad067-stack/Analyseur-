name: Quinte Top7 M8 vs Neural

on:
  workflow_dispatch:

jobs:
  analyse:

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r horse_prono_v2/requirements.txt
          pip install joblib
          pip install --upgrade "scikit-learn==1.9.1"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Check Neural files
        run: |
          echo "=========================================="
          echo "CHECK NEURAL #9"
          echo "=========================================="

          test -f models/neural/horseprono_neural_v1.pt
          test -f models/neural/horseprono_neural_v1_scaler.joblib
          test -f models/neural/horseprono_neural_v1_features.json

          echo "✅ Neural #9 files found"

      - name: Run Quinte Top7 analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

        run: |
          python -u horse_prono_v2/scripts/backtest_quinte_top7_m8_neural.py

      - name: Show results
        if: always()
        run: |
          echo "=========================================="
          echo "QUINTE TOP7 RESULTS"
          echo "=========================================="

          if [ -d "horse_prono_v2/artifacts/quinte_top7_m8_neural" ]; then
            ls -lh horse_prono_v2/artifacts/quinte_top7_m8_neural/
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quinte-top7-m8-neural-results
          path: horse_prono_v2/artifacts/quinte_top7_m8_neural/
          if-no-files-found: warn
          retention-days: 30
