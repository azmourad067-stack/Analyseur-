name: Neural V1 - Train Model

on:
  workflow_dispatch:

jobs:
  train-neural-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ======================================================
      # REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install PyTorch CPU
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Neural V1 dependencies
        run: |
          python -m pip install \
            numpy \
            pandas \
            scikit-learn \
            joblib \
            supabase \
            streamlit

      # ======================================================
      # ENVIRONMENT CHECK
      # ======================================================

      - name: Check Python and PyTorch
        run: |
          python --version
          python -c "import torch; print('PyTorch:', torch.__version__)"
          python -c "import torch; print('CUDA disponible:', torch.cuda.is_available())"

      # ======================================================
      # TRAINING
      # ======================================================

      - name: Train HorseProno Neural V1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -u -m neural.train

      # ======================================================
      # CHECK GENERATED MODEL
      # ======================================================

      - name: Show generated Neural files
        run: |
          echo "=========================================="
          echo "HORSEPRONO NEURAL V1 - GENERATED FILES"
          echo "=========================================="
          find models/neural -maxdepth 1 -type f -print -exec ls -lh {} \;

      # ======================================================
      # SAVE MODEL AS GITHUB ARTIFACT
      # ======================================================

      - name: Upload Neural V1 model
        uses: actions/upload-artifact@v4
        with:
          name: horseprono-neural-v1
          path: models/neural/
          if-no-files-found: error
          retention-days: 30
